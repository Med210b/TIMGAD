    <meta

      content="TIMGAD Government Transaction Services"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="TIMGAD Government Transaction Services | UAE"
    />

    <meta
      property="og:description"
      content="Professional government and corporate transaction services across the UAE. Precision, speed and compliance."

    />

    <!-- Twitter / Social Sharing -->
    <meta

    <!-- Favicon -->
    <link

      type="image/png"
      href="/TIMGAD/favicon.png"
    />

    <!--
      Google Translate callback.
      This MUST exist before Google's script loads.
    -->
    <script>
      window.googleTranslateElementInit = function () {
        if (
          window.google &&
          window.google.translate &&
          window.google.translate.TranslateElement
        ) {
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'ar,fr,ru,zh-CN',
              autoDisplay: false,
              multilanguagePage: true
            },
            'google_translate_element'
          );

          window.__timgadGoogleTranslateReady = true;

          window.dispatchEvent(
            new Event('timgad-google-translate-ready')
          );
        }
      };
    </script>

    <!-- Google Translate -->
    <script
      id="google-translate-script"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      defer
    ></script>
    <script type="module" crossorigin src="/TIMGAD/assets/index-CJrhsYLi.js"></script>
    <link rel="stylesheet" crossorigin href="/TIMGAD/assets/index-HWNEbJsL.css">
  </head>

  <body>
    <!--
      Google Translate engine.
      It is visually hidden by CSS from the React application.
    -->
    <div
      id="google_translate_element"
      aria-hidden="true"
    ></div>

    <div id="root"></div>

  </body>
</html>
